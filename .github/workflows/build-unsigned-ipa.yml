name: Build unsigned iOS app

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch official AprilTag 3 C detector
        run: |
          mkdir -p AprilTagVendor
          git clone --depth 1 https://github.com/AprilRobotics/apriltag.git AprilTagVendor/apriltag
          test -f AprilTagVendor/apriltag/tagStandard41h12.c

      - name: Register AprilTag C sources without copying repository resources
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          root = Path('AprilTagVendor/apriltag')
          # Only library C files: never copy README, CMake, tests or examples into the app.
          files = sorted(root.glob('*.c')) + sorted((root / 'common').glob('*.c'))
          files = [p for p in files if not any(x in p.name.lower() for x in ('demo', 'test', 'example', 'pywrap', 'python'))]
          assert files, 'No AprilTag C sources found'
          assert not any('pywrap' in p.name.lower() for p in files), 'Python wrapper must not be compiled for iOS'
          project = Path('project.yml')
          contents = project.read_text()
          marker = '      # APRILTAG_C_SOURCES_INSERT_HERE'
          assert marker in contents
          entries = '\n'.join('      - path: ' + p.as_posix() for p in files)
          project.write_text(contents.replace(marker, entries))
          print(f'Added {len(files)} AprilTag C library files to the source build phase')
          PYCODE

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iPhone
        run: |
          xcodebuild \
            -project VFXTracker.xcodeproj \
            -scheme VFXTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VFXTracker.app Payload/
          /usr/bin/zip -r VFXTracker-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VFXTracker-unsigned-IPA
          path: VFXTracker-unsigned.ipa
          retention-days: 14
