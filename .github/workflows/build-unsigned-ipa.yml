name: Build unsigned iOS app

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iPhone
        run: |
          xcodebuild \
            -project VFXTracker.xcodeproj \
            -scheme VFXTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VFXTracker.app Payload/
          /usr/bin/zip -r VFXTracker-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VFXTracker-unsigned-IPA
          path: VFXTracker-unsigned.ipa
          retention-days: 14
