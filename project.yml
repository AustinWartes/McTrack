name: VFXTracker
options:
  bundleIdPrefix: com.artisttools
  deploymentTarget:
    iOS: "17.0"
targets:
  VFXTracker:
    type: application
    platform: iOS
    sources:
      - path: VFXTracker
    info:
      path: VFXTracker/Info.plist
      properties:
        CFBundleDisplayName: McTrack
        NSCameraUsageDescription: McTrack uses the camera for camera tracking and recording.
        NSMicrophoneUsageDescription: McTrack records audio alongside camera video.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artisttools.VFXTracker
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
