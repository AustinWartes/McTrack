name: VFXTracker
options:
  bundleIdPrefix: com.artisttools
  deploymentTarget:
    iOS: "17.0"
targets:
  VFXTracker:
    type: application
    platform: iOS
    sources:
      - path: VFXTracker
      - path: AprilTagBridge/TagBridge.c
      # APRILTAG_C_SOURCES_INSERT_HERE
    info:
      path: VFXTracker/Info.plist
      properties:
        CFBundleDisplayName: McTrack
        NSCameraUsageDescription: McTrack uses the camera for camera tracking and recording.
        NSMicrophoneUsageDescription: McTrack records audio alongside camera video.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artisttools.VFXTracker
        MARKETING_VERSION: 1.2.2
        CURRENT_PROJECT_VERSION: 122
        SWIFT_VERSION: 5.0
        SWIFT_OBJC_BRIDGING_HEADER: AprilTagBridge/TagBridge.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/AprilTagVendor/apriltag $(SRCROOT)/AprilTagVendor/apriltag/common"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
